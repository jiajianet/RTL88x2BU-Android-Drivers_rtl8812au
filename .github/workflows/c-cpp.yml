name: Build rtl8812au Driver for Android

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本 (例如 android13)'
        required: true
        default: 'android13'
      kernel_version:
        description: '内核主版本 (例如 5.15)'
        required: true
        default: '5.15'
      version:
        description: '完整版本标识 (例如 android13-5.15)'
        required: true
        default: 'android13-5.15'
      os_patch_level:
        description: '安全补丁级别 (例如 2025-12)'
        required: true
        default: '2025-12'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo flex bison build-essential libssl-dev gcc-aarch64-linux-gnu

      - name: Initialize and sync kernel repository
        id: sync_kernel
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ github.event.inputs.version }}
          OS_PATCH_LEVEL: ${{ github.event.inputs.os_patch_level }}
        run: |
          set -euo pipefail
          mkdir -p kernel
          cd kernel

          ANDROID_PART="${VERSION%-*}"
          KERNEL_PART="${VERSION#*-}"
          FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${OS_PATCH_LEVEL}"
          echo "目标分支: common-${FORMATTED_BRANCH}"

          init_repo() {
            repo init -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --depth=1 || return 1
            REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common \
              ${FORMATTED_BRANCH} 2>/dev/null || true)
            if [[ -n "$REMOTE_BRANCH" ]] && grep -q deprecated <<< "$REMOTE_BRANCH"; then
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" \
                .repo/manifests/default.xml
              echo "⚠️  分支 common-${FORMATTED_BRANCH} 已弃用，使用 deprecated/ 路径"
            fi
            return 0
          }

          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "尝试 $attempt/$MAX_RETRIES 初始化 repo..."
            if init_repo; then
              echo "repo init 成功，开始同步..."
              if timeout 15m repo sync -c --current-branch --no-clone-bundle --no-tags \
                --jobs-checkout=4 -j4; then
                echo "内核源码同步完成"
                break
              else
                echo "repo sync 失败"
              fi
            else
              echo "repo init 失败"
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "清理并重试..."
              rm -rf .repo
              sleep 15
            else
              echo "所有重试均失败" >&2
              exit 1
            fi
          done

          cd common
          if [ -d .git ]; then
            echo "KERNEL_COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "KERNEL_COMMIT_DATE=$(git log -1 --format=%cI)" >> $GITHUB_ENV
            echo "KERNEL_COMMIT_MSG=$(git log -1 --format=%s)" >> $GITHUB_ENV
          fi

      - name: Prepare kernel build (defconfig + prepare + modules_prepare)
        working-directory: ${{ github.workspace }}/kernel/common
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          aarch64-linux-gnu-gcc --version
          make defconfig
          make oldconfig
          make prepare
          make modules_prepare -j$(nproc)

      - name: Compile rtl8812au driver
        working-directory: ${{ github.workspace }}
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          KERNEL_DIR: ${{ github.workspace }}/kernel/common
        run: |
          echo "当前目录: $(pwd)"
          MAKEFILE_PATH=$(find . -maxdepth 2 -name Makefile -type f | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "❌ 未找到 Makefile"
            exit 1
          fi
          echo "✅ 找到 Makefile: $MAKEFILE_PATH"
          DRIVER_DIR=$(dirname "$MAKEFILE_PATH")
          cd "$DRIVER_DIR"
          echo "切换至驱动目录: $(pwd)"

          # 启用 RTL8812AU
          sed -i 's/^CONFIG_RTL8812A = .*/CONFIG_RTL8812A = y/' Makefile
          sed -i 's/^CONFIG_RTL8822B = .*/CONFIG_RTL8822B = n/' Makefile

          # 平台配置
          sed -i 's/^CONFIG_PLATFORM_I386_PC = .*/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/^CONFIG_PLATFORM_ARM_ANDROID = .*/CONFIG_PLATFORM_ARM_ANDROID = y/' Makefile

          # 禁用警告转错误
          if ! grep -q "Wno-error" Makefile; then
            sed -i '/^ccflags-y +=/a ccflags-y += -Wno-error' Makefile
          fi

          echo "开始编译驱动 (直接 make)..."
          # 直接 make，不指定 -C
          make -j$(nproc) V=1

          # 查找生成的 .ko
          echo "查找 .ko 文件..."
          find . -name "*.ko" -type f -exec ls -lh {} \;
          KO_FILE=$(find . -name "*.ko" -type f | head -n1)
          if [ -z "$KO_FILE" ]; then
            echo "❌ 未找到 .ko 文件，检查 .o 文件："
            find . -name "*.o" -type f | head -n20
            exit 1
          fi
          echo "✅ 生成的模块: $KO_FILE"
          cp "$KO_FILE" "${{ github.workspace }}/88x2bu.ko"

      - name: Upload driver module as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 88x2bu-ko-${{ github.event.inputs.version }}-${{ github.event.inputs.os_patch_level }}
          path: 88x2bu.ko
          if-no-files-found: error
